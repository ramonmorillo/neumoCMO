name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pruebas unitarias y de estructura
        run: npm test
      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Pruebas E2E (escritorio y móvil)
        env:
          E2E_OUT: e2e-output
        run: npm run test:e2e
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output
          if-no-files-found: ignore
          retention-days: 14
